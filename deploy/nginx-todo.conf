      # Todo - ein Pfad unter fherrmann.com, keine Subdomain. Eingesetzt von
      # deploy/setup-todo.sh direkt vor dem /grades/-Block.
      #
      # Das Privat-Gate steht HIER, nicht auf Server-Ebene: fherrmann.com
      # selbst ist oeffentlich, nur dieser Pfad haengt hinter dem Cookie. Die
      # App prueft denselben Cookie noch einmal (SecurityConfig) - das hier ist
      # also nicht die einzige Schranke.
      location /todo/ {
          if ($fh_private = 0) {
              return 302 https://fherrmann.com/;
          }
          proxy_pass http://127.0.0.1:48210;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_redirect off;
      }

