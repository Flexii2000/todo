spring.application.name=Todo

# Die eine Datei, in der alles steht: Bereiche und Aufgaben.
todo.data-file=data/todo.json

# --- Netz ------------------------------------------------------------------
# Interner Port, nur localhost; nginx terminiert TLS. Ein Pfad unter
# fherrmann.com, keine Subdomain - kein DNS, kein Zertifikat.
server.port=48210
server.address=127.0.0.1
server.servlet.context-path=/todo
server.forward-headers-strategy=framework

# --- Zugang ------------------------------------------------------------------
# Der geteilte Privat-Modus-Token von fherrmann.com (wie beim Kalorienzaehler
# und bei Habits): steht in /etc/nginx/conf.d/private-mode.conf und kommt
# ueber /etc/todo.env herein. Der Vorgabewert ist nur fuer lokal.
todo.security.token=${FH_PRIVATE_TOKEN:changeme-local-token}

# --- Zeit ----------------------------------------------------------------------
todo.zone=Europe/Berlin

# Wie lange eine erledigte Aufgabe noch durchgestrichen zu sehen ist, bevor
# sie von selbst verschwindet. Geloescht wird sie dabei nicht.
todo.done-visible-days=3

# --- Erinnerungen per Push -------------------------------------------------
# Der Dienst schickt Erinnerungen selbst an die Fokus-App (Topic ist deren
# Bundle-ID). Ohne Schluessel passiert nichts - die Erinnerungen bleiben dann
# stumm in der Datei. Schluessel und Konfiguration kommen ueber /etc/todo.env;
# das Setup-Skript uebernimmt sie vom Kalorienzaehler, es ist derselbe Schluessel.
todo.push.key-file=${APNS_KEY_FILE:}
todo.push.key-id=${APNS_KEY_ID:}
todo.push.team-id=${APNS_TEAM_ID:}
todo.push.topic=${APNS_TOPIC:com.fherrmann.fokus}
todo.push.host=${APNS_HOST:https://api.sandbox.push.apple.com}
todo.push.devices-file=${TODO_DEVICES_FILE:data/devices.json}
# Wie oft nachgesehen wird, ob eine Erinnerung faellig ist (Millisekunden).
todo.push.check-interval=60000
